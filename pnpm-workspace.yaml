packages:
  - 'apps/*'
# Allow esbuild's install script (pnpm blocks build scripts by default; pnpm 11
# turns the notice into a hard error). pnpm 11 reads `allowBuilds`; pnpm 10 reads
# `onlyBuiltDependencies`. Keep both so it works across versions and in CI.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
